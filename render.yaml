# Instalación con un clic en Render: crea el servidor y la base de datos (plan gratuito para probar).
# Antes de tener clientes reales, pasá el servidor a "Starter" y la base a "Basic" desde el panel de Render:
# el servidor gratuito se duerme tras 15 minutos sin uso y la base gratuita vence a los 30 días.
# Al instalar, Render pide solo tres datos: ANTHROPIC_API_KEY, ADMIN_EMAIL y ADMIN_PASSWORD.
services:
  - type: web
    name: comprobando
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: comprobando-db
          property: connectionString
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: comprobando-db
    plan: free
    region: virginia
    databaseName: comprobando
    user: comprobando
