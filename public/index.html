<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comprobado</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="card login-card">
    <div class="brand"><span class="mark">✓</span>Comprobado</div>
    <p class="muted">Ventas por WhatsApp medidas de punta a punta.</p>
    <label>Email<input id="lEmail" type="email" autocomplete="username" required></label>
    <label>Contraseña<input id="lPass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Entrar</button>
    <p class="err" id="lErr" role="alert"></p>
  </form>
</div>

<div id="shell" class="shell" hidden>
  <aside class="side">
    <div class="brand"><span class="mark">✓</span>Comprobado</div>
    <div class="acct" id="acctName"></div>
    <nav id="nav">
      <a href="#resumen">Resumen</a>
      <a href="#ventas">Ventas <span class="pill" id="pendingPill" hidden></span></a>
      <a href="#leads">Clics y chats</a>
      <a href="#subir">Cargar comprobante</a>
      <a href="#lineas">Números de WhatsApp</a>
      <a href="#integraciones">Integraciones</a>
      <a href="#ajustes">Ajustes</a>
      <a href="#admin" id="navAdmin" hidden>Cuentas (admin)</a>
    </nav>
    <button class="btn ghost" id="logout" type="button">Cerrar sesión</button>
  </aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
