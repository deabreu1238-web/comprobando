<title>Agencia PanelPro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap">
<style>
/* Panel interno de cuentas: oscuro por defecto, tarjetas sobre fondo profundo, una columna en celular. */
:root {
  --bg: #070b12; --bg2: #0c121c; --card: #0f1622; --card2: #141d2b; --line: #1d2736; --line2: #2a3547;
  --text: #eef1f6; --text2: #a9b3c3; --muted: #717d90;
  --brand: #2b4dff; --brand2: #3a5bff; --green: #2ee59d; --amber: #fbbf24; --red: #ff6b6b; --blue: #6e9cff; --violet: #b18cff;
  --ok-bg: rgba(46,229,157,.13); --warn-bg: rgba(251,191,36,.14); --bad-bg: rgba(255,107,107,.14); --none-bg: rgba(255,255,255,.06);
  --shadow: 0 30px 80px -40px rgba(0,0,0,.9);
  --f: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fd: 'Inter Tight', 'Inter', ui-sans-serif, system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f3f5f9; --bg2: #e9edf4; --card: #ffffff; --card2: #f6f8fb; --line: #e3e8f0; --line2: #d3dae6;
  --text: #0c111b; --text2: #3f4a5c; --muted: #6b7587;
  --brand: #2443e6; --brand2: #2f50f2; --green: #0f9f6b; --amber: #b7791f; --red: #d64545; --blue: #2f5fd0; --violet: #7c4fd6;
  --ok-bg: rgba(15,159,107,.12); --warn-bg: rgba(183,121,31,.13); --bad-bg: rgba(214,69,69,.11); --none-bg: rgba(12,17,27,.05);
  --shadow: 0 24px 60px -36px rgba(15,23,42,.35); color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f3f5f9; --bg2: #e9edf4; --card: #ffffff; --card2: #f6f8fb; --line: #e3e8f0; --line2: #d3dae6;
  --text: #0c111b; --text2: #3f4a5c; --muted: #6b7587;
  --brand: #2443e6; --brand2: #2f50f2; --green: #0f9f6b; --amber: #b7791f; --red: #d64545; --blue: #2f5fd0; --violet: #7c4fd6;
  --ok-bg: rgba(15,159,107,.12); --warn-bg: rgba(183,121,31,.13); --bad-bg: rgba(214,69,69,.11); --none-bg: rgba(12,17,27,.05);
  --shadow: 0 24px 60px -36px rgba(15,23,42,.35); color-scheme: light;
}
* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--f); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit }
[hidden] { display: none !important }
.num { font-variant-numeric: tabular-nums }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 22px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }

/* barra superior */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 26px }
.brand { display: flex; align-items: center; gap: 10px; font: 700 17px var(--fd); letter-spacing: -.01em }
.mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--brand), #6e7bff) }
.brand small { font: 600 13px var(--f); color: var(--text2); padding-left: 10px; margin-left: 2px; border-left: 1px solid var(--line2) }
.sync { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); padding: 6px 11px; border: 1px solid var(--line); border-radius: 99px; background: var(--card) }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.sync.ok i { background: var(--green) } .sync.warn i { background: var(--amber) } .sync.bad i { background: var(--red) }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text); white-space: nowrap; transition: background .15s, border-color .15s }
.btn:hover { border-color: var(--muted) }
.btn:focus-visible, .chip:focus-visible, .link:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .row-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff }
.btn.pri:hover { background: var(--brand2) }
.btn.ok { background: var(--green); border-color: var(--green); color: #04150e }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent) }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px }
.btn svg { width: 17px; height: 17px; flex: none }
.btn:disabled { opacity: .5; cursor: default }
.link { background: none; border: 0; padding: 0; color: var(--blue); cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 3px }

/* encabezado */
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px }
.eyebrow { font: 600 11.5px var(--f); letter-spacing: .16em; text-transform: uppercase; color: var(--text2) }
h1 { font: 800 clamp(30px, 4.4vw, 42px)/1.05 var(--fd); letter-spacing: -.025em; margin: 8px 0 6px; text-wrap: balance }
.sub { color: var(--text2); margin: 0; font-size: 14.5px }
.actions { display: flex; gap: 8px; flex-wrap: wrap }

/* banda de ejemplo */
.demo-band { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: 14px; border: 1px dashed color-mix(in srgb, var(--violet) 55%, transparent); background: color-mix(in srgb, var(--violet) 9%, transparent); margin-bottom: 16px; font-size: 14px; color: var(--text2) }
.demo-band b { color: var(--violet) }
.demo-band .btn { margin-left: auto }

/* tarjetas y KPIs */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; min-width: 0; box-shadow: var(--shadow) }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 12px }
.kpi .lbl { display: flex; align-items: center; gap: 10px; font: 600 11.5px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--text2) }
.kpi .lbl span { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); flex: none }
.kpi .lbl svg { width: 16px; height: 16px }
.kpi .val { font: 800 clamp(24px, 2.6vw, 31px)/1.1 var(--fd); letter-spacing: -.02em; margin-top: 14px; overflow-wrap: anywhere }
.kpi .val small { display: block; font-size: .62em; color: var(--text2); font-weight: 700 }
.kpi .note { color: var(--muted); font-size: 13px; margin-top: 8px }
.bar { height: 7px; border-radius: 99px; background: var(--none-bg); overflow: hidden; margin-top: 12px }
.bar i { display: block; height: 100%; border-radius: inherit; background: var(--green) }
.grid2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); margin-bottom: 12px }
.ch { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap }
.ch h2 { font: 700 18px var(--fd); margin: 0; letter-spacing: -.01em }
.ch p { margin: 3px 0 0; color: var(--muted); font-size: 13.5px }
.ch .grow { flex: 1; min-width: 0 }

/* quién debe */
.debts { display: grid; gap: 10px; margin-top: 16px }
.debt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 15px; border: 1px solid var(--line2); border-left: 4px solid var(--amber); border-radius: 14px; background: var(--card2) }
.debt.late { border-left-color: var(--red) }
.debt h3 { margin: 0; font-size: 15px; font-weight: 600 }
.debt h3 b { font-weight: 700 }
.debt p { margin: 3px 0 0; font-size: 13px; color: var(--text2) }
.debt .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line2); border-radius: 14px; margin-top: 16px; font-size: 14px }

/* solo lectura (socio): se ocultan los controles que cambian datos */
body.ro #new, body.ro [data-pay], body.ro [data-edit], body.ro [data-resto], body.ro [data-fecha], body.ro [data-del], body.ro #dedit, body.ro #dpay, body.ro .tacts { display: none !important }
.ro-band { display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 14px; border: 1px solid var(--line2); background: var(--card); margin-bottom: 16px; font-size: 14px; color: var(--text2) }
.ro-band b { color: var(--text) }

/* avisos */
.tip-band { display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 14px; border: 1px dashed color-mix(in srgb, var(--blue) 45%, transparent); background: color-mix(in srgb, var(--blue) 8%, transparent); margin-bottom: 14px; font-size: 14px; color: var(--text2) }
.btn.icon { padding: 0; width: 42px; flex: none !important }
.kpi .val small.conv { font-size: .44em; font-weight: 600; color: var(--muted); margin-top: 4px }

/* próximos cobros */
.agenda { display: grid; gap: 6px; margin-top: 14px }
.ag-sep { font: 600 11px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px }
.ag-sep:first-child { margin-top: 0 }
.ag-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line) }
.ag-row.soon { border-color: color-mix(in srgb, var(--amber) 55%, transparent) }
.ag-day b { display: block; font-size: 14px; text-transform: capitalize }
.ag-day span { font-size: 12px; color: var(--muted) }
.ag-who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0 }
.tag { font: 700 10.5px var(--f); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--none-bg); color: var(--text2) }
.ag-amt { font-size: 15px }
.ag-row .acts { display: flex; gap: 6px }

/* salud del negocio */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px }
.tile { background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0 }
.tile small { display: block; font: 600 11px var(--f); letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
.tile b { display: block; font: 800 21px/1.2 var(--fd); letter-spacing: -.01em; margin: 4px 0 2px; overflow-wrap: anywhere }
.tile span { font-size: 12.5px; color: var(--muted) }
.tile.good b { color: var(--green) } .tile.mid b { color: var(--amber) } .tile.bad b { color: var(--red) }

/* gastos y actividad */
.glist, .feed { display: grid; gap: 6px; margin-top: 14px }
.gi { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line) }
.gi .m, .fi .m { color: var(--muted); font-size: 12.5px }
.gtot { display: flex; justify-content: space-between; padding: 12px 4px 0; margin-top: 10px; border-top: 1px solid var(--line); font-size: 14px; color: var(--text2) }
.gtot b { color: var(--text); font-size: 16px }
.fi { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px }
.fi:last-child { border-bottom: 0 }
.fi .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-top: 6px }
.field.chk { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text) }
.field.chk input { width: 20px; height: 20px; min-height: 0; accent-color: var(--green) }
.legend i.g { height: 0; border-top: 2px solid var(--red); border-radius: 0 }
.chart .gas { fill: none; stroke: var(--red); stroke-width: 2; opacity: .8 }
.chart .gasd { fill: var(--red) }
body.ro #cfg, body.ro #gadd, body.ro [data-gedit], body.ro [data-agenda] { display: none !important }

/* tabla como tarjetas en celular */
@media (max-width: 700px) {
  .tbl table { min-width: 0 }
  .tbl thead { display: none }
  .tbl tr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; padding: 14px 4px; border-bottom: 1px solid var(--line) }
  .tbl td { border: 0; padding: 0 }
  .tbl td[data-l]::before { content: attr(data-l); display: block; font: 600 10.5px var(--f); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px }
  .tbl td[data-l="Cliente"] { grid-column: 1 / -1 }
  .tbl td[data-l="Cliente"]::before { display: none }
  .tbl .tdacts { grid-column: 1 / -1 }
  .ag-row { grid-template-columns: 60px minmax(0, 1fr); }
  .ag-row .ag-amt { grid-column: 2 } .ag-row .acts { grid-column: 1 / -1; justify-content: flex-end }
  .tiles { grid-template-columns: 1fr 1fr }
}

/* pagos parciales */
.parc { margin-bottom: 12px }
.psum { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--text2) }
.psum b { color: var(--text) }
.prows { display: grid; gap: 10px; margin-top: 16px }
.prow { display: grid; grid-template-columns: minmax(140px, 1.1fr) minmax(160px, 1.4fr) minmax(90px, .7fr) minmax(130px, .9fr) auto; gap: 16px; align-items: center; padding: 13px 15px; border: 1px solid var(--line2); border-left: 4px solid var(--line2); border-radius: 14px; background: var(--card2) }
.prow.warn { border-left-color: var(--amber) } .prow.bad { border-left-color: var(--red) }
.prow .m { color: var(--muted); font-size: 12.5px; margin-top: 2px }
.pline { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; color: var(--text2) }
.pline b { color: var(--text) }
.prow .bar { margin-top: 8px }
.prow .bar i { background: var(--amber) }
.pfalta small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.pfalta b { font: 800 18px var(--fd); color: var(--text) }
.prow .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end }
.resto { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; margin-top: 12px; padding: 12px; border: 1px dashed color-mix(in srgb, var(--amber) 50%, transparent); border-radius: 12px }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px }
.resto .quick { margin-top: 0 }
@media (max-width: 980px) { .prow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) } .prow .pprog { grid-column: 1 / -1; order: 3 } .prow .acts { grid-column: 1 / -1; order: 4; justify-content: flex-start } }
@media (max-width: 560px) { .resto { grid-template-columns: 1fr } }

/* gráfico */
.chart { width: 100%; height: auto; display: block; margin-top: 10px }
.chart .gl { stroke: var(--line); stroke-dasharray: 3 5 }
.chart .bp { fill: color-mix(in srgb, var(--green) 55%, transparent) }
.chart .bn { fill: var(--green) }
.chart .exp { stroke: var(--text2); stroke-width: 2; stroke-dasharray: 5 4 }
.chart text { fill: var(--muted); font: 600 12px var(--f) }
.chart .tv { fill: var(--text2); font: 700 12.5px var(--f) }
.chart .tnow { fill: var(--green) }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 6px }
.legend span { display: inline-flex; align-items: center; gap: 7px }
.legend i { width: 14px; height: 9px; border-radius: 3px; background: var(--green) }
.legend i.e { height: 0; border-top: 2px dashed var(--text2); border-radius: 0 }

/* tabla */
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 14px 0 6px }
.chip { border: 1px solid var(--line2); background: transparent; color: var(--text2); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text) }
.chip em { font-style: normal; opacity: .65; margin-left: 4px }
.search { margin-left: auto; min-height: 38px; width: 240px; max-width: 100%; padding: 0 13px; border-radius: 11px; border: 1px solid var(--line2); background: var(--bg2); color: var(--text) }
.tbl { overflow-x: auto; margin: 0 -4px }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 820px }
th { text-align: left; font: 600 11px var(--f); letter-spacing: .13em; text-transform: uppercase; color: var(--muted); padding: 11px 10px; border-bottom: 1px solid var(--line2); white-space: nowrap }
th button { all: unset; cursor: pointer }
th button:focus-visible { outline: 2px solid var(--brand) }
td { padding: 13px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
tr.off td { opacity: .55 }
td .m { color: var(--muted); font-size: 12.5px }
.row-btn { all: unset; cursor: pointer; font-weight: 700 }
.row-btn:hover { text-decoration: underline; text-underline-offset: 3px }
.pill { display: inline-block; font: 700 11.5px var(--f); padding: 3px 9px; border-radius: 99px; white-space: nowrap }
.pill.ok { color: var(--green); background: var(--ok-bg) } .pill.warn { color: var(--amber); background: var(--warn-bg) }
.pill.bad { color: var(--red); background: var(--bad-bg) } .pill.none { color: var(--muted); background: var(--none-bg) }
.note-tag { display: inline-block; margin-top: 5px; font-size: 12.5px; color: var(--text2); background: color-mix(in srgb, var(--violet) 12%, transparent); border-radius: 8px; padding: 2px 8px; max-width: 300px }
.tacts { display: flex; gap: 6px; flex-wrap: wrap }

/* diálogos */
dialog { border: 0; padding: 0; background: transparent; color: var(--text); max-width: calc(100vw - 24px); width: 560px }
dialog::backdrop { background: rgba(3,6,12,.66); backdrop-filter: blur(4px) }
.modal { background: var(--card); border: 1px solid var(--line2); border-radius: 22px; padding: 24px; box-shadow: var(--shadow); max-height: calc(100vh - 32px); overflow: auto }
.modal h2 { font: 800 22px var(--fd); margin: 0 0 4px; letter-spacing: -.015em }
.modal .lead { color: var(--text2); margin: 0 0 16px; font-size: 14px }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.fsec { grid-column: 1 / -1; font: 600 11px var(--f); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px }
.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text2); min-width: 0 }
.field.full { grid-column: 1 / -1 }
.field input, .field select, .field textarea { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line2); background: var(--bg2); font-size: 15px; font-weight: 500; color: var(--text) }
.field textarea { padding: 10px 12px; min-height: 70px; resize: vertical }
.field small { font-weight: 500; color: var(--muted) }
.calc { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--bg2); font-size: 14px; color: var(--text2); margin-top: 14px }
.calc b { color: var(--text) }
.err { color: var(--red); font-size: 13.5px; min-height: 1em; margin: 10px 0 0 }
.mrow { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px }
.mrow .left { margin-right: auto }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 14px 0 }
.fact { background: var(--bg2); border-radius: 12px; padding: 10px 12px; min-width: 0 }
.fact small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase }
.fact b { display: block; margin-top: 3px; font-size: 15px; overflow-wrap: anywhere }
.months { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px }
.mo { font: 700 11.5px var(--f); padding: 5px 9px; border-radius: 8px; background: var(--none-bg); color: var(--muted); text-transform: capitalize }
.mo.pagado { background: var(--ok-bg); color: var(--green) } .mo.parcial { background: var(--warn-bg); color: var(--amber) } .mo.pendiente { background: var(--bad-bg); color: var(--red) }
.plist { display: grid; gap: 8px; max-height: 36vh; overflow: auto }
.pi { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--line2); border-radius: 12px; font-size: 14px }
.pi .m { color: var(--muted); font-size: 12.5px }

.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px); opacity: 0; visibility: hidden; background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 12px; transition: opacity .2s, transform .2s, visibility .2s; z-index: 50; max-width: calc(100vw - 32px) }
.toast.on { opacity: 1; visibility: visible; transform: translate(-50%, 0) }
.loading { padding: 60px 0; text-align: center; color: var(--muted) }
.welcome { text-align: center; padding: 44px 20px }
.welcome h2 { font: 800 24px var(--fd); margin: 14px 0 6px; letter-spacing: -.015em }
.welcome p { color: var(--text2); max-width: 520px; margin: 0 auto 18px }
.welcome .actions { justify-content: center }

  // ------------------------------------------------------------ arranque
  var timer = setTimeout(function () { if (!S.loaded.c || !S.loaded.p) { sync('warn', 'Sin conexión todavía'); if (!S.db) { app.innerHTML = noDb(); bindNoDb(); } else app.innerHTML = '<div class="card welcome"><h2>Todavía no pude traer tus datos</h2><p>Puede ser la conexión. Esperá unos segundos: en cuanto responda, aparecen solos.</p></div>'; } }, 10000);
  function noDb() { return '<div class="card welcome"><h2>Este panel guarda tus datos en claude.ai</h2><p>Abrilo desde tu cuenta de claude.ai (en la compu o en la app) para ver y cargar tus clientes. Mientras tanto podés ver cómo funciona con un ejemplo.</p><div class="actions"><button class="btn" id="tryDemo">Ver el ejemplo</button></div></div>'; }
  function bindNoDb() { $('#tryDemo').onclick = function () { S.demo = true; render(); }; }
  use('user').then(function (u) {
    if (!u) return;
    u.isOwner().then(function (own) { S.owner = own !== false; document.body.classList.toggle('ro', !S.owner); if (!S.owner) sync('ok', 'Solo lectura'); render(); }, function () {});
  });
  use('db').then(function (db) {
    if (!db) { clearTimeout(timer); sync('bad', 'Sin base de datos'); app.innerHTML = noDb(); bindNoDb(); return; }
    S.db = db;
    function onErr(e) { sync('bad', e && e.code === 'revoked' ? 'Sin acceso' : 'Se cortó la conexión'); clearTimeout(timer); if (!S.loaded.c || !S.loaded.p) { app.innerHTML = '<div class="card welcome"><h2>No pude abrir tus datos</h2><p>' + (e && e.code === 'revoked' ? 'Este panel es privado del dueño.' : 'Recargá la página en un rato.') + '</p></div>'; } }
    function snap(key) { return function (s) {
      var list = s.docs.map(function (d) { var x = Object.assign({}, d.data()); x.id = d.id; return x; });

    }; }

    db.doc('config/general').onSnapshot(function (s) { S.cfg = s.exists ? Object.assign({}, s.data()) : {}; render(); }, function () {});
  }, function () { clearTimeout(timer); sync('bad', 'Sin base de datos'); app.innerHTML = noDb(); bindNoDb(); });
})();
